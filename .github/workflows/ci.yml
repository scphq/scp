name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # run_id, not ref: a shared group still drops a queued run between two
  # quick main pushes even with cancel-in-progress false.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the packageManager field, so CI runs the Bun the repo pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Before the tests: the broker smoke test runs the built packages under Node 22.13+.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the lockfile is current
        run: |
          bun install --lockfile-only
          git diff --exit-code -- bun.lock

      - name: Lint and format check
        run: bunx biome ci .

      - name: Check relay versions
        run: bun scripts/relay-version.ts --check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build packages
        run: bun run build:packages

      - name: Import every package entry and run every bin in plain Node
        run: |
          for dir in packages/*/; do
            if [ -d "$dir/dist" ]; then
              name=$(node -p "require('./$dir/package.json').name")
              bin=$(node -p "Object.values(require('./$dir/package.json').bin ?? {})[0] ?? ''")
              if [ -n "$bin" ]; then
                (cd "$dir" && node "$bin" --version)
                echo "ran $name"
              else
                (cd "$dir" && node --input-type=module -e "await import('$name')")
                echo "imported $name"
              fi
            fi
          done

      # Runs `next build`, then bundles the Cloudflare worker; nothing is deployed.
      - name: Build the site
        run: bun run --filter @scp-dev/web build:worker

  rust:
    name: Rust relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      SCP_RELAY_TEST_PG: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Package publish dry run
        run: cargo publish --workspace --dry-run --locked

  windows:
    name: Windows relay
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates
      - working-directory: crates
        run: cargo build --locked --bin scp-relay

  broker-conformance:
    name: Broker conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      # ts and ts-node run here; a later job can set SCP_BROKER_BIN to add a native engine.
      - name: Broker conformance against ts and ts-node
        env:
          SCP_BROKER_NODE: node
        run: bun test packages/conformance/src/broker

  hook:
    name: Native hook (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    defaults:
      run:
        working-directory: crates
    env:
      # the start time, args and comm cross-check against ps must run, not skip
      SCP_HOOK_REQUIRE_PS: "1"
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates
          key: hook-${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test scp-hook
        run: cargo test --locked -p scp-hook --target ${{ matrix.target }}

  conformance:
    name: Relay conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/scp-compat
          key: scp-compat-${{ runner.os }}-${{ hashFiles('packages/conformance/compat/package-lock.json') }}

      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the relay and the native broker
        working-directory: crates
        run: cargo build --locked --bin scp-relay --bin scp-broker

      - name: Broker conformance against rust
        env:
          SCP_BROKER_BIN: ${{ github.workspace }}/crates/target/debug/scp-broker
          SCP_BROKER_TARGETS: rust
        run: bun test packages/conformance/src/broker

      # ts always runs; the two variables add rust-sqlite and rust-pg.
      - name: Conformance against ts, rust-sqlite and rust-pg
        env:
          SCP_CONFORMANCE_COMPAT: "1"
          SCP_COMPAT_DIR: ${{ runner.temp }}/scp-compat
          SCP_RELAY_BIN: ${{ github.workspace }}/crates/target/debug/scp-relay
          SCP_CONFORMANCE_PG: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun test packages/conformance/src/*.test.ts

      # the machine fixtures again, with native brokers on every machine and then on every other one
      - name: Multi-machine conformance with native brokers
        env:
          SCP_CONFORMANCE_COMPAT: "1"
          SCP_COMPAT_DIR: ${{ runner.temp }}/scp-compat
          SCP_RELAY_BIN: ${{ github.workspace }}/crates/target/debug/scp-relay
          SCP_BROKER_BIN: ${{ github.workspace }}/crates/target/debug/scp-broker
          SCP_CONFORMANCE_TARGETS: ts,rust-sqlite
        run: |
          files="packages/conformance/src/cli.test.ts packages/conformance/src/lifecycle.test.ts packages/conformance/src/wire-hub.test.ts packages/conformance/src/compat.test.ts"
          SCP_MACHINE_BROKERS=rust bun test $files
          SCP_MACHINE_BROKERS=mixed bun test $files

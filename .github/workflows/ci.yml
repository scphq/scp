name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # run_id, not ref: a shared group still drops a queued run between two
  # quick main pushes even with cancel-in-progress false.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the packageManager field, so CI runs the Bun the repo pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Before the tests: the broker smoke test runs the built packages under Node 22.13+.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the lockfile is current
        run: |
          bun install --lockfile-only
          git diff --exit-code -- bun.lock

      - name: Lint and format check
        run: bunx biome ci .

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build packages
        run: bun run build:packages

      - name: Import every package entry and run every bin in plain Node
        run: |
          for dir in packages/*/; do
            if [ -d "$dir/dist" ]; then
              name=$(node -p "require('./$dir/package.json').name")
              bin=$(node -p "Object.values(require('./$dir/package.json').bin ?? {})[0] ?? ''")
              if [ -n "$bin" ]; then
                (cd "$dir" && node "$bin" --version)
                echo "ran $name"
              else
                (cd "$dir" && node --input-type=module -e "await import('$name')")
                echo "imported $name"
              fi
            fi
          done

      # Runs `next build`, then bundles the Cloudflare worker; nothing is deployed.
      - name: Build the site
        run: bun run --filter @scp-dev/web build:worker

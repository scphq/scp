name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # run_id, not ref: a shared group still drops a queued run between two
  # quick main pushes even with cancel-in-progress false.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the packageManager field, so CI runs the Bun the repo pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Before the tests: the broker smoke test runs the built packages under Node 22.13+.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the lockfile is current
        run: |
          bun install --lockfile-only
          git diff --exit-code -- bun.lock

      - name: Lint and format check
        run: bunx biome ci .

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build packages
        run: bun run build:packages

      - name: Import every package entry and run every bin in plain Node
        run: |
          for dir in packages/*/; do
            if [ -d "$dir/dist" ]; then
              name=$(node -p "require('./$dir/package.json').name")
              bin=$(node -p "Object.values(require('./$dir/package.json').bin ?? {})[0] ?? ''")
              if [ -n "$bin" ]; then
                (cd "$dir" && node "$bin" --version)
                echo "ran $name"
              else
                (cd "$dir" && node --input-type=module -e "await import('$name')")
                echo "imported $name"
              fi
            fi
          done

      # Runs `next build`, then bundles the Cloudflare worker; nothing is deployed.
      - name: Build the site
        run: bun run --filter @scp-dev/web build:worker

  rust:
    name: Rust relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      SCP_RELAY_TEST_PG: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  conformance:
    name: Relay conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the relay
        working-directory: crates
        run: cargo build --locked --bin scp-relay

      # ts always runs; the two variables add rust-sqlite and rust-pg.
      - name: Conformance against ts, rust-sqlite and rust-pg
        env:
          SCP_RELAY_BIN: ${{ github.workspace }}/crates/target/debug/scp-relay
          SCP_CONFORMANCE_PG: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun test packages/conformance

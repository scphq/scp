name: Deploy

# Deploys scp.dev (apps/web) and app.scp.dev (apps/relay) on merge to main,
# each only when its own sources changed. A manual run deploys both.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect changes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/spec/**'
            relay:
              - 'apps/relay/**'
              - 'packages/core/**'
              - 'packages/hub/**'
              - 'packages/broker/**'

  web:
    name: Deploy scp.dev
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and deploy
        working-directory: apps/web
        run: bun run deploy

      - name: Smoke test
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors https://scp.dev/)
          echo "https://scp.dev/ returned $status"
          [ "$status" = "200" ]

  relay:
    name: Deploy app.scp.dev
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # wrangler bundles the workspace packages from dist/, not the bun source condition.
      - name: Build packages
        run: bun run build:packages

      - name: Apply D1 migrations
        working-directory: apps/relay
        run: npx wrangler d1 migrations apply scp-relay --remote

      - name: Deploy
        working-directory: apps/relay
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors https://app.scp.dev/health)
          echo "https://app.scp.dev/health returned $status"
          [ "$status" = "200" ]

name: Build native hooks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/crates/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates
          key: native-${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: crates
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        shell: bash
        run: cargo build --release --locked --bin scp-hook --target "$TARGET"
      - name: Archive and checksum
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/relay-archive.py pack "$TARGET" artifacts scp-hook
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: artifacts/*
          retention-days: 7

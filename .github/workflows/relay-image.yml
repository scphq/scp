name: Relay image

on:
  pull_request:
    paths: ['crates/**', 'packages/dashboard/**', 'apps/relay/src/**', 'packages/core/**', 'packages/hub/**', 'bun.lock', 'packages/conformance/**', '.github/workflows/relay-image.yml']
  push:
    branches: [main]
    paths: ['crates/**', 'packages/dashboard/**', 'apps/relay/src/**', 'packages/core/**', 'packages/hub/**', 'bun.lock', 'packages/conformance/**', '.github/workflows/relay-image.yml']
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/scphq/scp-relay

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: crates
          file: crates/Dockerfile
          platforms: linux/amd64
          load: true
          tags: scp-relay:smoke
          cache-from: type=gha,scope=relay-smoke
          cache-to: type=gha,mode=max,scope=relay-smoke
      - name: Container conformance
        env:
          SCP_CONFORMANCE_IMAGE: scp-relay:smoke
          SCP_CONFORMANCE_TARGETS: docker
        run: bun test packages/conformance --timeout 30000 --test-name-pattern 'HTTP checks credentials|HTTP requests are fresh|hello advertises|container preserves|dashboard public API'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/dashboard/Dockerfile
          platforms: linux/amd64
          load: true
          tags: scp-dashboard:smoke
          cache-from: type=gha,scope=dashboard-smoke
          cache-to: type=gha,mode=max,scope=dashboard-smoke
      - name: Dashboard health
        run: |
          id=$(docker run -d -e SCP_DASHBOARD_RELAY=http://127.0.0.1:1 scp-dashboard:smoke)
          trap 'docker rm -f "$id"' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker logs "$id"; exit 1; fi
            sleep 1
          done
          docker logs "$id"
          exit 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [relay, dashboard]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: relay
            context: crates
            dockerfile: crates/Dockerfile
          - image: dashboard
            context: .
            dockerfile: packages/dashboard/Dockerfile
    env:
      IMAGE: ghcr.io/scphq/scp-${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=$(bun scripts/relay-version.ts)
          if [ -n "$RELEASE_VERSION" ]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$version" = "$RELEASE_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  manifest:
    strategy:
      matrix:
        image: [relay, dashboard]
    env:
      IMAGE: ghcr.io/scphq/scp-${{ matrix.image }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.image }}-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            {
              echo 'tags<<EOF_TAGS'
              echo "type=raw,value=v$RELEASE_VERSION"
              echo "type=raw,value=${RELEASE_VERSION%.*}"
              echo "type=raw,value=latest"
              echo EOF_TAGS
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=type=raw,value=edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.tags }}
          flavor: latest=false
      - name: Merge manifest
        id: merge
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          digests=()
          for file in "$RUNNER_TEMP"/digests/*; do digests+=("$IMAGE@sha256:$(basename "$file")"); done
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
          first=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign manifest
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

name: Release

# Pending changesets: open or update a "chore: release" PR (version bumps and
# CHANGELOGs). No pending changesets: run the checks and publish packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publishing: ${{ steps.pending.outputs.publishing }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "publishing=$([ "$count" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  native:
    needs: gate
    if: needs.gate.outputs.publishing == 'true'
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read

  release:
    needs: [gate, native]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        if: needs.gate.outputs.publishing == 'true'
        run: bun run typecheck

      - name: Test
        if: needs.gate.outputs.publishing == 'true'
        run: bun test

      - name: Build packages
        if: needs.gate.outputs.publishing == 'true'
        run: bun run build:packages

      # Publishing means no changesets are pending, so changesets/action runs no
      # `version` command: these manifests carry the versions it publishes.
      - name: Check npm publish targets
        if: needs.gate.outputs.publishing == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/check-publish-targets.ts

      - uses: actions/download-artifact@v8
        if: needs.gate.outputs.publishing == 'true'
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true

      - name: Publish native packages
        if: needs.gate.outputs.publishing == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          bun scripts/native-version.ts check
          VERSION=$(bun scripts/native-version.ts)
          publish() {
            dir=$1
            name=$(node -p "require('./$dir/package.json').name")
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' "https://registry.npmjs.org/$name/$VERSION")
            if [ "$status" = 200 ]; then
              echo "Already published: $name@$VERSION"
            elif [ "$status" = 404 ]; then
              npm publish "./$dir" --provenance --access public
            else
              echo "::error::npm lookup failed for $name: HTTP $status"
              exit 1
            fi
          }
          while read -r key target; do
            python scripts/relay-archive.py unpack "$target" artifacts scp-hook
            bun crates/npm/native.ts "$key" "artifacts/scp-hook-$target/scp-hook" "npm-packages/$key"
            publish "npm-packages/$key"
          done <<'PLATFORMS'
          linux-x64-gnu x86_64-unknown-linux-gnu
          linux-arm64-gnu aarch64-unknown-linux-gnu
          linux-x64-musl x86_64-unknown-linux-musl
          darwin-arm64 aarch64-apple-darwin
          darwin-x64 x86_64-apple-darwin
          PLATFORMS

      # changesets does not rewrite the workspace: protocol, so pin it to concrete
      # versions before publish (ephemeral checkout; the source keeps workspace:*).
      - name: Pin workspace deps for npm publish
        if: needs.gate.outputs.publishing == 'true'
        run: bun scripts/pin-workspace-deps.ts

      - name: Release PR or publish
        uses: changesets/action@v1.9.0
        with:
          version: bun run version-packages
          publish: bunx changeset publish
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm tries OIDC trusted publishing first and falls back to this token
          # only when the exchange fails. Leave NPM_TOKEN unset once every package
          # has a trusted publisher; see docs/RELEASING.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

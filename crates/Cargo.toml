[workspace]
members = ["scp-core", "scp-relay-store", "scp-relay", "scp-hook", "scp-broker"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/scphq/scp"
version = "0.4.2"

[workspace.dependencies]
tokio = { version = "=1.47.1", features = ["full"] }
axum = { version = "=0.8.4", features = ["ws"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["json", "fmt"] }
clap = { version = "=4.5.46", features = ["derive", "env"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls-ring", "json"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
rand = "=0.8.5"
thiserror = "=2.0.16"
async-trait = "=0.1.89"
futures-util = "=0.3.31"
time = { version = "=0.3.41", features = ["formatting", "parsing"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json"] }
tokio-tungstenite = "=0.26.2"

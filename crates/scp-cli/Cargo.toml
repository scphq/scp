[package]
name = "scp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The swarm command line verbs, natively"
build = "build.rs"

[lib]
name = "scp_cli"

[dependencies]
indexmap.workspace = true
libc.workspace = true
scp-core = { package = "scp-dev-core", path = "../scp-core", version = "=0.4.10" }
scp-mcp = { path = "../scp-mcp" }
serde_json.workspace = true
tokio = { version = "=1.47.1", features = ["rt", "net", "io-util", "time", "macros", "sync", "process"] }
toml.workspace = true
zip.workspace = true

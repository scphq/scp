[package]
name = "scp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The swarm command line verbs, natively"
build = "build.rs"

[lib]
name = "scp_cli"

[dependencies]
futures-util.workspace = true
indexmap.workspace = true
libc.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
scp-broker = { path = "../scp-broker" }
scp-core = { package = "scp-dev-core", path = "../scp-core", version = "=0.4.14" }
scp-mcp = { path = "../scp-mcp" }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.47.1", features = ["rt", "net", "io-util", "time", "macros", "sync", "process"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit.workspace = true
zip.workspace = true

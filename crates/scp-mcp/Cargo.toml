[package]
name = "scp-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native SCP MCP server"

[lib]
name = "scp_mcp"

[[bin]]
name = "scp-mcp"
path = "src/bin/scp-mcp.rs"

[dependencies]
libc = "=0.2.191"
rand.workspace = true
hex.workspace = true
scp-core = { package = "scp-dev-core", path = "../scp-core", version = "=0.4.14" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.47.1", features = ["rt", "net", "io-util", "io-std", "time", "macros", "sync", "process"] }

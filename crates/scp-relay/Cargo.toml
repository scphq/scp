[package]
name = "scp-relay-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

description = "Self-hosted SCP relay server with SQLite and PostgreSQL storage"
homepage = "https://scp.dev"
readme = "README.md"
keywords = ["scp", "relay", "agents", "messaging"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "scp_relay"

[[bin]]
name = "scp-relay"
path = "src/main.rs"

[dependencies]
scp-relay-store = { path = "../scp-relay-store", version = "=0.4.0" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
thiserror.workspace = true
futures-util.workspace = true
hyper = "=1.12.0"
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio-tungstenite.workspace = true
async-trait.workspace = true
time.workspace = true
regex = "=1.13.1"
reqwest = { workspace = true, features = ["rustls-tls"] }
hmac = "=0.12.1"
subtle = "=2.6.1"

[dev-dependencies]
reqwest.workspace = true

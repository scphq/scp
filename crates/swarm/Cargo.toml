[package]
name = "scp-swarm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The native SCP swarm binary: broker daemon, hook client and MCP server"
build = "build.rs"

[[bin]]
name = "swarm"
path = "src/main.rs"

[dependencies]
clap.workspace = true
libc = "=0.2.191"
scp-broker = { path = "../scp-broker" }
scp-hook = { path = "../scp-hook" }
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
